<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h2>Invoice Tracker</h2>

        <button class="btn" onclick="payInvoice()">Pay Invoice</button>
        <button class="btn" onclick="resetInvoice()">Reset Invoice</button>
        <button class="btn" onclick="viewInvoice()">View Invoice</button>
        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>
        <p id="view_amount"></p>
        <p id="view_status"></p>
        <p id="message"></p>

        <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
        <script>
            // Replace with your InvoiceTracker contract address from Remix.
            const contractAddress = "0x2cdff40a979c5faaafbf2c71396b7a30fe4fd4b9";
            const contractABI = [
                {"inputs":[],"name":"payInvoice","outputs":[],"stateMutability":"nonpayable","type":"function"},
                {"inputs":[],"name":"resetInvoice","outputs":[],"stateMutability":"nonpayable","type":"function"},
                {"inputs":[],"name":"invoiceAmount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
                {"inputs":[],"name":"isPaid","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"}
            ];

            const web3 = new Web3(Web3.givenProvider);
            const contract = new web3.eth.Contract(contractABI, contractAddress);

            async function payInvoice() {
                try {
                    const accounts = await web3.eth.requestAccounts();
                    await contract.methods.payInvoice().send({from: accounts[0]});
                    document.getElementById("message").innerText = "Invoice marked as paid.";
                    await viewInvoice();
                } catch (error) {
                    document.getElementById("message").innerText = error.message;
                }
            }

            async function resetInvoice() {
                try {
                    const accounts = await web3.eth.requestAccounts();
                    await contract.methods.resetInvoice().send({from: accounts[0]});
                    document.getElementById("message").innerText = "Invoice marked as unpaid.";
                    await viewInvoice();
                } catch (error) {
                    document.getElementById("message").innerText = error.message;
                }
            }

            async function viewInvoice() {
                try {
                    const amount = await contract.methods.invoiceAmount().call();
                    const paid = await contract.methods.isPaid().call();
                    document.getElementById("view_amount").innerText = "Invoice Amount: " + amount;
                    document.getElementById("view_status").innerText = "Payment Status: " + (paid ? "Paid" : "Unpaid");
                } catch (error) {
                    document.getElementById("message").innerText = error.message;
                }
            }
        </script>
    </div>
</body>
