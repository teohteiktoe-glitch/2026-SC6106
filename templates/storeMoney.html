<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h2>Store Money</h2>

        <input type="text" id="depositor" placeholder="Enter depositor address">
        <input type="number" id="amount" placeholder="Enter amount">
        <button class="btn" onclick="storeMoney()">Transfer</button>
        <button class="btn" onclick="transaction()">transaction</button>
        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>
        <p id="view_depositor"></p>
        <p id="view_amount"></p>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>

        <script>
            const contractAddress = "0xCC8FcF3c8762783ebd7eDDec17803CA647809a94";
            const contractABI = [
                {
                    "inputs": [
                        {
                            "internalType": "address",
                            "name": "_depositor",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "_amount",
                            "type": "uint256"
                        }
                    ],
                    "name": "store",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },
                {
                    "inputs": [],
                    "name": "transaction",
                    "outputs": [
                        {
                            "internalType": "address",
                            "name": "",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "",
                            "type": "uint256"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                }
            ];

            const web3 = new Web3(Web3.givenProvider);
            const contract = new web3.eth.Contract(contractABI,contractAddress);

            async function storeMoney() {
                const accounts = await web3.eth.requestAccounts();
                console.log(accounts[0]);
                const depositor = document.getElementById("depositor").value;
                const amount = document.getElementById("amount").value;
                await contract.methods.store(depositor,amount).send({from:accounts[0]});
            }
            async function transaction() {
                const results = await contract.methods.transaction().call();
                document.getElementById("view_depositor").innerText = "Depositor "+ results[0];
                document.getElementById("view_amount").innerText = "Amount "+ results[1];
            }

        </script>
    </div>
</body>
